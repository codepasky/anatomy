<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A&P Prefix Flashcards</title>
<style>
  :root{
    --ink:#2b2620;
    --paper:#f6f1e7;
    --card:#fffdf8;
    --line:#d8cdb8;
    --accent:#6b7a5e;
    --accent2:#a3512b;
    --muted:#8a8070;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, #00000008 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
  }
  h1{
    font-size:clamp(1.15rem, 5vw, 1.5rem);
    letter-spacing:0.02em;
    margin:0 0 2px;
    font-weight:700;
    text-align:center;
    max-width:520px;
  }
  .sub{
    color:var(--muted);
    font-size:0.8rem;
    margin-bottom:18px;
    font-style:italic;
    text-align:center;
    max-width:480px;
    padding:0 8px;
  }
  .controls{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
    padding:0 2px;
  }
  label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--accent);
    font-family: 'Trebuchet MS', sans-serif;
    font-weight:700;
  }
  select{
    width:100%;
    max-width:100%;
    box-sizing:border-box;
    padding:11px 34px 11px 12px;
    font-size:16px;
    font-family: inherit;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--card);
    color:var(--ink);
    appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--accent2) 50%), linear-gradient(135deg, var(--accent2) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    white-space:normal;
  }
  select:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .deck-meta{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    margin-bottom:10px;
    font-family:'Trebuchet MS', sans-serif;
    padding:0 2px;
  }
  .deck-title{
    font-weight:700;
    color:var(--accent2);
    font-size:0.85rem;
    line-height:1.3;
  }
  .count{
    color:var(--muted);
    font-size:0.75rem;
    white-space:nowrap;
  }

  .stage{
    width:100%;
    max-width:520px;
    perspective:1400px;
  }
  .card{
    position:relative;
    width:100%;
    height:min(280px, 55vh);
    min-height:200px;
    cursor:pointer;
  }
  .card-inner{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--card);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 18px rgba(43,38,32,0.08);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:5vw 18px;
    box-sizing:border-box;
  }
  .face::before{
    content:'';
    position:absolute;
    top:10px; left:10px; right:10px; bottom:10px;
    border:1px dashed var(--line);
    border-radius:3px;
    pointer-events:none;
  }
  .front .tag{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.65rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:4vw;
  }
  .front .prefix{
    font-size:clamp(1.7rem, 8vw, 2.6rem);
    font-weight:700;
    color:var(--ink);
    word-break:break-word;
  }
  .front .hint{
    margin-top:4vw;
    font-size:0.75rem;
    color:var(--accent);
    font-style:italic;
  }
  .back{
    transform:rotateY(180deg);
    background:#faf4e8;
  }
  .back .meaning{
    font-size:clamp(1.05rem, 5vw, 1.3rem);
    font-weight:700;
    color:var(--accent2);
    margin-bottom:3vw;
  }
  .back .meaning-label{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.65rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  .back .example{
    font-size:0.85rem;
    line-height:1.5;
    color:var(--ink);
    max-width:400px;
  }
  .back .example b{color:var(--accent2);}

  .nav{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:16px;
    font-family:'Trebuchet MS', sans-serif;
  }
  .nav button{
    font-family:inherit;
    font-size:0.82rem;
    padding:10px 14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:3px;
    cursor:pointer;
    flex-shrink:0;
    touch-action:manipulation;
  }
  .nav button:disabled{opacity:0.3; cursor:default;}
  .nav button.ghost{
    background:transparent;
    color:var(--ink);
  }
  .progress{
    font-size:0.78rem;
    color:var(--muted);
    white-space:nowrap;
  }
  .jump-row{
    width:100%;
    max-width:520px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    margin-top:16px;
  }
  .jump-row button{
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--muted);
    font-size:0.68rem;
    font-family:'Trebuchet MS', sans-serif;
    cursor:pointer;
    touch-action:manipulation;
    flex-shrink:0;
  }
  .jump-row button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .empty{
    color:var(--muted);
    font-style:italic;
    margin-top:40px;
  }
  .pagenav{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    font-family:'Trebuchet MS', sans-serif;
    flex-wrap:wrap;
    justify-content:center;
  }
  .pagenav a{
    text-decoration:none;
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:7px 14px;
    border:1px solid var(--line);
    border-radius:20px;
    color:var(--muted);
    background:var(--card);
    touch-action:manipulation;
  }
  .pagenav a.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  @media (max-width:480px){
    .card{height:min(230px, 50vh); min-height:180px;}
  }
  @media (max-width:360px){
    .nav button{padding:9px 11px; font-size:0.76rem;}
  }
</style>
</head>

const chapterNames = {

2:"Ch. 2 — Chemical Basis of Life",
3:"Ch. 3 — Cells",
4:"Ch. 4 — Cellular Metabolism",
5:"Ch. 5 — Tissues",
6:"Ch. 6 — Integumentary System",
7:"Ch. 7 — Skeletal System",
8:"Ch. 8 — Joints of the Skeletal System",
9:"Ch. 9 — Muscular System",
10:"Ch. 10 — Nervous System I",
11:"Ch. 11 — Nervous System II",

14:"Ch. 14 — Blood",
15:"Ch. 15 — Cardiovascular System",
16:"Ch. 16 — Lymphatic System & Immunity",
17:"Ch. 17 — Digestive System",

23:"Ch. 23 — Pregnancy, Growth & Development",
24:"Ch. 24 — Genetics & Genomics"
};

// ---- Class schedule: date, chapter, [startIndex, endIndexInclusive], label ----
const schedule = [
  {date:"Thu 8/20/26", ch:1, range:[0,8], label:"Append – Nas"},
  {date:"Tue 8/25/26", ch:1, range:[9,16], label:"Orb – -tomy"},
  {date:"Thu 8/27/26", ch:2, range:[0,4], label:"Bio – Lip"},
  {date:"Tue 9/1/26", ch:2, range:[5,11], label:"-lyt – -valent"},
  {date:"Thu 9/3/26", ch:3, range:[0,4], label:"Cyt – Inter"},
  {date:"Thu 9/10/26", ch:3, range:[5,12], label:"Iso – vesic"},
  {date:"Tue 9/15/26", ch:4, range:[0,4], label:"Aer – Co"},
  {date:"Thu 9/17/26", ch:4, range:[5,9], label:"De – -zym"},
  {date:"Tue 9/22/26", ch:5, range:[0,7], label:"Adip – Inter"},
  {date:"Thu 9/24/26", ch:5, range:[8,15], label:"Macr – Stria"},
  {date:"Tue 9/29/26", ch:6, range:[0,4], label:"Alb – Follic"},
  {date:"Thu 10/1/26", ch:6, range:[5,9], label:"Hol – Seb"},
  {date:"Thu 10/8/26", ch:7, range:[0,12], label:"Ax – Inter"},
  {date:"Tue 10/13/26", ch:7, range:[13,17], label:"Intra – Poie"}
];

// ---- State ----
let currentDeck = [];
let idx = 0;

const dateSelect = document.getElementById('dateSelect');
const chapterSelect = document.getElementById('chapterSelect');
const deckTitle = document.getElementById('deckTitle');
const deckCount = document.getElementById('deckCount');
const cardEl = document.getElementById('card');
const prefixText = document.getElementById('prefixText');
const meaningText = document.getElementById('meaningText');
const exampleText = document.getElementById('exampleText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressText = document.getElementById('progressText');
const jumpRow = document.getElementById('jumpRow');

// populate date dropdown
const dPlaceholder = document.createElement('option');
dPlaceholder.textContent = "— choose a class date —";
dPlaceholder.value = "";
dateSelect.appendChild(dPlaceholder);
schedule.forEach((s,i)=>{
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${s.date} — Ch.${s.ch}: ${s.label}`;
  dateSelect.appendChild(opt);
});

// populate chapter dropdown
const cPlaceholder = document.createElement('option');
cPlaceholder.textContent = "— choose a chapter —";
cPlaceholder.value = "";
chapterSelect.appendChild(cPlaceholder);
Object.keys(chapters).map(Number).sort((a,b)=>a-b).forEach(ch=>{
  const opt = document.createElement('option');
  opt.value = ch;
  opt.textContent = chapterNames[ch];
  chapterSelect.appendChild(opt);
});

dateSelect.addEventListener('change', ()=>{
  if(dateSelect.value === "") return;
  chapterSelect.value = "";
  const s = schedule[dateSelect.value];
  const full = chapters[s.ch];
  currentDeck = full.slice(s.range[0], s.range[1]+1);
  deckTitle.textContent = `${s.date} · ${chapterNames[s.ch]}`;
  loadDeck();
});

chapterSelect.addEventListener('change', ()=>{
  if(chapterSelect.value === "") return;
  dateSelect.value = "";
  const ch = Number(chapterSelect.value);
  currentDeck = chapters[ch].slice();
  deckTitle.textContent = chapterNames[ch] + " (full chapter)";
  loadDeck();
});

function loadDeck(){
  idx = 0;
  deckCount.textContent = currentDeck.length + " cards";
  buildJumpDots();
  render();
}

function buildJumpDots(){
  jumpRow.innerHTML = "";
  currentDeck.forEach((_,i)=>{
    const b = document.createElement('button');
    b.textContent = i+1;
    b.addEventListener('click', ()=>{ idx=i; render(); });
    jumpRow.appendChild(b);
  });
}

function render(){
  if(currentDeck.length === 0){
    cardEl.style.display = "none";
    return;
  }
  cardEl.style.display = "block";
  cardEl.classList.remove('flipped');
  const [prefix, meaning, example] = currentDeck[idx];
  prefixText.textContent = prefix;
  meaningText.textContent = meaning;
  exampleText.innerHTML = example.replace(/^([^–]+–)/, '<b>$1</b>');
  progressText.textContent = `${idx+1} / ${currentDeck.length}`;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === currentDeck.length - 1;
  [...jumpRow.children].forEach((b,i)=> b.classList.toggle('active', i===idx));
}

cardEl.addEventListener('click', ()=> cardEl.classList.toggle('flipped'));
prevBtn.addEventListener('click', ()=>{ if(idx>0){ idx--; render(); } });
nextBtn.addEventListener('click', ()=>{ if(idx<currentDeck.length-1){ idx++; render(); } });
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft') prevBtn.click();
  if(e.key === ' '){ e.preventDefault(); cardEl.classList.toggle('flipped'); }
});

// default: load first scheduled date
dateSelect.value = 0;
dateSelect.dispatchEvent(new Event('change'));
</script>
