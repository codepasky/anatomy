<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>General List Flashcards</title>
<style>
  :root{
    --ink:#2b2620;
    --paper:#f6f1e7;
    --card:#fffdf8;
    --line:#d8cdb8;
    --accent:#6b7a5e;
    --accent2:#a3512b;
    --muted:#8a8070;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, #00000008 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
    min-height:100vh;
  }
  h1{
    font-size:1.5rem;
    letter-spacing:0.02em;
    margin:0 0 2px;
    font-weight:700;
  }
  .sub{
    color:var(--muted);
    font-size:0.85rem;
    margin-bottom:22px;
    font-style:italic;
  }
  .pagenav{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    font-family:'Trebuchet MS', sans-serif;
  }
  .pagenav a{
    text-decoration:none;
    font-size:0.78rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:7px 14px;
    border:1px solid var(--line);
    border-radius:20px;
    color:var(--muted);
    background:var(--card);
  }
  .pagenav a.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .controls{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:22px;
  }
  label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--accent);
    font-family: 'Trebuchet MS', sans-serif;
    font-weight:700;
  }
  select{
    width:100%;
    padding:11px 12px;
    font-size:0.95rem;
    font-family: inherit;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--card);
    color:var(--ink);
    appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--accent2) 50%), linear-gradient(135deg, var(--accent2) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .deck-meta{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
    font-family:'Trebuchet MS', sans-serif;
  }
  .deck-title{
    font-weight:700;
    color:var(--accent2);
    font-size:0.95rem;
  }
  .count{
    color:var(--muted);
    font-size:0.8rem;
  }

  .stage{
    width:100%;
    max-width:520px;
    perspective:1400px;
  }
  .card{
    position:relative;
    width:100%;
    height:280px;
    cursor:pointer;
  }
  .card-inner{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--card);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 18px rgba(43,38,32,0.08);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:28px;
  }
  .face::before{
    content:'';
    position:absolute;
    top:10px; left:10px; right:10px; bottom:10px;
    border:1px dashed var(--line);
    border-radius:3px;
    pointer-events:none;
  }
  .front .tag{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.68rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:16px;
  }
  .front .prefix{
    font-size:2.6rem;
    font-weight:700;
    color:var(--ink);
  }
  .front .hint{
    margin-top:18px;
    font-size:0.78rem;
    color:var(--accent);
    font-style:italic;
  }
  .back{
    transform:rotateY(180deg);
    background:#faf4e8;
  }
  .back .meaning{
    font-size:1.3rem;
    font-weight:700;
    color:var(--accent2);
    margin-bottom:14px;
  }
  .back .meaning-label{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.68rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  .back .example{
    font-size:0.92rem;
    line-height:1.5;
    color:var(--ink);
    max-width:400px;
  }
  .back .example b{color:var(--accent2);}

  .nav{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:18px;
    font-family:'Trebuchet MS', sans-serif;
  }
  .nav button{
    font-family:inherit;
    font-size:0.85rem;
    padding:9px 16px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:3px;
    cursor:pointer;
  }
  .nav button:disabled{opacity:0.3; cursor:default;}
  .nav button.ghost{
    background:transparent;
    color:var(--ink);
  }
  .progress{
    font-size:0.8rem;
    color:var(--muted);
  }
  .jump-row{
    width:100%;
    max-width:520px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:16px;
  }
  .jump-row button{
    width:30px;height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--muted);
    font-size:0.7rem;
    font-family:'Trebuchet MS', sans-serif;
    cursor:pointer;
  }
  .jump-row button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  @media (max-width:480px){
    .card{height:250px;}
    .front .prefix{font-size:2rem;}
  }
</style>
</head>
<body>
  <div class="pagenav">
    <a href="index.html">Chapters</a>
    <a href="general.html" class="active">General List</a>
  </div>

  <h1>General List — Prefix &amp; Suffix Flashcards</h1>
  <div class="sub">Location/direction, number, organs, and suffix sets from the General List quiz.</div>

  <div class="controls">
    <div>
      <label for="setSelect">Choose a set</label>
      <select id="setSelect"></select>
    </div>
  </div>

  <div class="deck-meta">
    <div class="deck-title" id="deckTitle"></div>
    <div class="count" id="deckCount"></div>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="card-inner">
        <div class="face front">
          <div class="tag" id="frontTag">Prefix</div>
          <div class="prefix" id="prefixText"></div>
          <div class="hint">tap to reveal meaning</div>
        </div>
        <div class="face back">
          <div class="meaning-label">Meaning</div>
          <div class="meaning" id="meaningText"></div>
          <div class="example" id="exampleText"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="ghost" id="prevBtn">&larr; Prev</button>
    <div class="progress" id="progressText"></div>
    <button id="nextBtn">Next &rarr;</button>
  </div>

  <div class="jump-row" id="jumpRow"></div>

<script>
// ---- General list data: [term, meaning, example, tag] ----
const sets = {
  "loc": {
    name: "1. Location, Direction & Tendency",
    tag: "Prefix",
    cards: [
["Ab-","from, away","abnormal – away from normal"],
["Ad-","to, near, toward","adrenal – near the kidney"],
["Ante-","before","antepartum – before delivery of child"],
["Brady-","slow","bradycardia – slow heart beat"],
["Brev-","short","brevity – in a short time"],
["Circum-","around","circumocular – around the eye"],
["Co-","with, together","coordinate – work together"],
["Con-","with, together","congenital – with birth"],
["Contra-","against","contraindicated – not indicated"],
["Counter-","against","counterirritant – against irritation"],
["Dis-","apart from","disarticulated – taking a joint apart"],
["Ect-","outside","ectonuclear – outside the nucleus"],
["End-","within","endocardium – membrane lining inner heart"],
["Epi-","upon, on top of","epidermis – upon the skin"],
["Ex-","out from","exhalation – breathe out"],
["Hypo-","under, lower","hypodermic – under the skin"],
["Hyper-","above, higher","hyperactive – higher level activity"],
["Im-","not","immature – not mature"],
["In-","not","incurable – not curable"],
["Infra-","under, below","infrapatellar – below the knee"],
["Peri-","around","pericardium – sac around the heart"],
["Post-","after","postmortem – after death"],
["Pre-","before","prenatal – before birth"],
["Pro-","before","prognosis – a fore-knowing"],
["Super-","above, on top","superciliary – above the eyebrow"],
["Supra-","above, on top","suprapubic – above the pubic bone"],
["Sym-","with, together","symphony – sounds played together"],
["Syn-","with, together","synarthrosis – union of bones"],
["Trans-","through, across","transurethral – through the urethra"]
    ]
  },
  "num": {
    name: "2. Number & Measurement",
    tag: "Prefix",
    cards: [
["Uni-","one","unicycle – one wheel"],
["Mono-","one","mononuclear – one nucleus"],
["Bi-","two","bilateral – two sides"],
["Bin-","two","binocular – two eyes"],
["Di-","two","dicephalic – two heads"],
["Ter-","three","tertiary – the third part or stage"],
["Tri-","three","trilobar – three lobes"],
["Quadr-","four","quadriceps – muscle with four heads"],
["Tetra-","four","tetracycline – a four-ringed molecule"],
["Poly-","many","polydactyly – many digits (more than 5)"],
["Oligo-","few","oligosaccharide – few sugars linked together"],
["Micro-","small","microscope – equipment to view small things"],
["Macro-","large","macrophage – large eating cell"],
["Mega-","great, enormous","megadontia – huge teeth"]
    ]
  },
  "organs": {
    name: "3. Organs, Structures & Things",
    tag: "Prefix / Root",
    cards: [
["Acoust-","sound","acoustics – quality of sound"],
["Aud-","ear, hear","audition – to hear someone"],
["Abdomin/o","abdomen","abdominal – relating to the abdomen"],
["Acr/o","extremity, limbs","acromegaly – abnormally large limbs"],
["Blast/o","early, embryonic","blastocyte – embryonic type cell"],
["Aden/o","gland","adenopathy – disease of a gland"],
["Angi/o","vessel","angiogram – picture of a vessel"],
["Arthr/o","joint","arthritis – inflammation of a joint"],
["Bucc/o","cheek","buccolabial – relating to cheek and lip"],
["Cardi/o","heart","cardiology – study of the heart"],
["Corp-","body","corpus callosum – connecting body"],
["Chondr/o","cartilage","chondrocyte – cartilage cell"],
["Cephal/o","head","cephalic – relating to the head"],
["Cyst/o","bladder","cystoscopy – view of the bladder"],
["Cyt/o","cell","cytokinesis – cell movement"],
["Dent/o","tooth","dental – referring to teeth"],
["Dermat/o","skin","dermatitis – skin inflammation"],
["Duoden/o","duodenum","duodenal – relating to the duodenum"],
["Encephal/o","brain","encephalitis – brain inflammation"],
["Gastr/o","stomach","gastrointestinal – stomach and intestine"],
["Hepat/o","liver","hepatitis – liver inflammation"],
["Gloss/o","tongue","glossopathy – tongue disease"],
["Glute-","buttocks","gluteus minimus – small buttocks muscle"],
["Laryng/o","larynx","laryngitis – larynx inflammation"],
["My/o","muscle","myocardium – heart muscle"],
["Nephr/o","kidney","nephrologist – one who studies kidneys"],
["Neur/o","nerve","neurosurgeon – surgeon of nervous system"],
["Oste/o","bone","osteocyte – bone cell"],
["Ot/o","ear","otitis media – middle ear inflammation"],
["Ophthalm/o","eye","exophthalmos – eyes bulge out"],
["Path/o","disease","pathological – relating to disease"],
["Pneumon/o","lung","pneumonia – condition of the lung"],
["Rhin/o","nose","rhinoplasty – reform the nose"],
["Stomat/o","mouth, opening","stomatitis – mouth inflammation"],
["Thorac/o","chest","thoracocentesis – puncture of the thorax"]
    ]
  },
  "relations": {
    name: "4. Suffixes: Relations, Conditions & Agents",
    tag: "Suffix",
    cards: [
["-ac","related to","cardiac – related to the heart"],
["-ious","related to","contagious – communicable by contact"],
["-ic","related to","pyloric – related to pyloric valve of stomach"],
["-ism","condition","mutism – condition of being mute"],
["-osis","condition","scoliosis – S-shaped condition of backbone"],
["-tion","condition","constipation – constant blockage condition"],
["-ist","agent (a person)","ophthalmologist – eye doctor"],
["-or","agent","operator"],
["-er","agent","examiner"],
["-ician","agent","physician"]
    ]
  },
  "surgical": {
    name: "5. Suffixes: Surgical & Operative",
    tag: "Suffix",
    cards: [
["-centesis","to puncture","amniocentesis – puncture the amnion (fluid)"],
["-ectomy","to cut out and remove","appendectomy – cut out & remove appendix"],
["-ostomy","to cut and form opening","colostomy – opening to drain the colon"],
["-otomy","to cut or slice","tracheotomy – cut the trachea"],
["-pexy","to fix or repair","gastropexy – repair the stomach"],
["-plasty","to reform or repair","rhinoplasty – reform the nose"],
["-rraphy","to suture, sew","arteriorraphy – suture an artery"],
["-scopy","to view","otoscope – instrument to view ear"]
    ]
  },
  "other": {
    name: "6. Other Suffixes",
    tag: "Suffix",
    cards: [
["-algia","pain","neuralgia – nerve pain"],
["-cide","kill or destroy","germicide – substance that kills germs"],
["-emia","of the blood","cholesterolemia – cholesterol in the blood"],
["-gram","writing or record","electrocardiogram – record of heart action"],
["-graph","recording instrument","electrocardiograph – records the heart"],
["-itis","inflammation","appendicitis – appendix inflammation"],
["-ology","the study of","ophthalmology – study of the eye"],
["-oma","tumor","lymphoma – tumor of lymphatics"],
["-orrhea","flow","menorrhea – flow during menstruation"],
["-malacia","soft","osteomalacia – bone softening"],
["-phasia","speech","dysphasia – slurred or blunted speech"],
["-phobia","fear","arachnophobia – fear of spiders"]
    ]
  }
};

let currentDeck = [];
let currentTag = "Prefix";
let idx = 0;

const setSelect = document.getElementById('setSelect');
const deckTitle = document.getElementById('deckTitle');
const deckCount = document.getElementById('deckCount');
const cardEl = document.getElementById('card');
const frontTag = document.getElementById('frontTag');
const prefixText = document.getElementById('prefixText');
const meaningText = document.getElementById('meaningText');
const exampleText = document.getElementById('exampleText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressText = document.getElementById('progressText');
const jumpRow = document.getElementById('jumpRow');

Object.keys(sets).forEach(key=>{
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = sets[key].name;
  setSelect.appendChild(opt);
});

setSelect.addEventListener('change', ()=>{
  const s = sets[setSelect.value];
  currentDeck = s.cards;
  currentTag = s.tag;
  deckTitle.textContent = s.name;
  loadDeck();
});

function loadDeck(){
  idx = 0;
  deckCount.textContent = currentDeck.length + " cards";
  buildJumpDots();
  render();
}

function buildJumpDots(){
  jumpRow.innerHTML = "";
  currentDeck.forEach((_,i)=>{
    const b = document.createElement('button');
    b.textContent = i+1;
    b.addEventListener('click', ()=>{ idx=i; render(); });
    jumpRow.appendChild(b);
  });
}

function render(){
  if(currentDeck.length === 0){ return; }
  cardEl.classList.remove('flipped');
  const [term, meaning, example] = currentDeck[idx];
  frontTag.textContent = currentTag;
  prefixText.textContent = term;
  meaningText.textContent = meaning;
  exampleText.innerHTML = example.replace(/^([^–]+–)/, '<b>$1</b>');
  progressText.textContent = `${idx+1} / ${currentDeck.length}`;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === currentDeck.length - 1;
  [...jumpRow.children].forEach((b,i)=> b.classList.toggle('active', i===idx));
}

cardEl.addEventListener('click', ()=> cardEl.classList.toggle('flipped'));
prevBtn.addEventListener('click', ()=>{ if(idx>0){ idx--; render(); } });
nextBtn.addEventListener('click', ()=>{ if(idx<currentDeck.length-1){ idx++; render(); } });
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft') prevBtn.click();
  if(e.key === ' '){ e.preventDefault(); cardEl.classList.toggle('flipped'); }
});

setSelect.value = "loc";
setSelect.dispatchEvent(new Event('change'));
</script>
</body>
</html>
